<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經文、頌文背記</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --border: #e5e7eb;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #dceafc 0%, #eef0fb 45%, #ddf2ec 100%) fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    width: 100%;
    max-width: 720px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }

  /* ---------- 上傳區 ---------- */
  #setup h2 { font-size: 16px; margin-bottom: 12px; }
  .upload-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 44px;
    padding: 0 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  /* 經文按鈕彩色背景 */
  #defaultTextBtn { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
  #defaultTextBtn:hover { background: #bfdbfe; border-color: #3b82f6; }
  #heartSutraBtn { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
  #heartSutraBtn:hover { background: #fecaca; border-color: #ef4444; }
  #eightVijnanasBtn { background: #dcfce7; border-color: #86efac; color: #15803d; }
  #eightVijnanasBtn:hover { background: #bbf7d0; border-color: #22c55e; }
  #yogaSilaBtn { background: #fef3c7; border-color: #fcd34d; color: #b45309; }
  #yogaSilaBtn:hover { background: #fde68a; border-color: #f59e0b; }
  #diamondSutraBtn { background: #ede9fe; border-color: #c4b5fd; color: #6d28d9; }
  #diamondSutraBtn:hover { background: #ddd6fe; border-color: #8b5cf6; }
  #fileName { color: var(--muted); font-size: 13px; }
  .or { color: var(--muted); font-size: 13px; margin: 14px 0 8px; }
  textarea {
    width: 100%; min-height: 180px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .setup-actions { margin-top: 14px; text-align: right; }

  /* ---------- 練習區 ---------- */
  #practice { display: none; flex-direction: column; gap: 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }

  /* 歷史框區域：隨進度向上滾動 */
  #historyWrap {
    height: 360px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fafbfc;
    padding: 10px;
  }
  #historyRows { display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; min-height: 100%; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .cbox {
    width: 42px; height: 48px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    position: relative;
  }
  .cbox.correct { color: #16a34a; border-color: #86efac; }
  .cbox.wrong {
    color: var(--danger);
    border-color: #fca5a5;
    background: var(--danger-soft);
    cursor: help;
  }
  /* 懸停錯誤框顯示正確字符 */
  .cbox.wrong .reveal { display: none; }
  .cbox.wrong:hover .reveal {
    display: flex;
    position: absolute;
    inset: 0;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 7px;
    z-index: 2;
  }
  .cbox.current {
    border: 2px dashed var(--accent);
    background: #fff;
  }
  .cbox.current { cursor: pointer; }
  .cbox.current .ph { color: #cbd5e1; font-size: 14px; }
  .cbox.revealed {
    color: #dc2626;
    border-color: #fca5a5;
    background: #fff5f5;
  }
  .cbox.pending { color: #d1d5db; }
  /* 句首重新開始按鈕 */
  .reloadBtn {
    order: 1;
    width: 42px; height: 48px;
    border: 1px solid #93c5fd;
    border-radius: 8px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 22px;
    cursor: pointer;
    flex-shrink: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .reloadBtn.show { display: inline-flex; }
  .reloadBtn:hover { background: #fef3c7; }
  @media (max-width: 600px) {
    .reloadBtn { width: 32px; height: 38px; font-size: 17px; border-radius: 6px; }
  }
  .cbox.skipped {
    color: #2563eb;
    border-color: #93c5fd;
    background: #eff6ff;
    font-style: normal;
  }
  #fullText .skipgreen { color: #2563eb; }

  /* 候選清單 */
  .choices-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; text-align: center; }
  /* 候選區：每行固定 7 個 */
  #choices {
    display: grid;
    grid-template-columns: repeat(4, 56px);
    gap: 10px;
    justify-content: center;
    background: #eef4fb;
    border: 1px solid #d6e4f7;
    border-radius: 12px;
    padding: 12px;
  }
  .choice:disabled { opacity: .45; cursor: default; transform: none; }
  .choice {
    min-width: 0; width: 100%; height: 56px;
    padding: 0 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-size: 26px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .1s, border-color .15s, background .15s;
  }
  .choice:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--accent-soft); }
  .choice:active { transform: translateY(0); }

  /* ---------- 完成區 ---------- */
  #result { display: none; }
  #result h2 { font-size: 16px; margin-bottom: 4px; }
  #summary { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  #fullText {
    font-size: 20px;
    line-height: 2;
    word-break: break-all;
  }
  #fullText .err {
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: 4px;
    padding: 0 2px;
    cursor: help;
    position: relative;
  }
  #errorList { margin-bottom: 16px; }
  #errorList h3 { font-size: 14px; margin-bottom: 8px; color: var(--danger); }
  #errorList .none { color: #16a34a; font-size: 14px; }
  #errorList .sentrow {
    display: flex; align-items: baseline; gap: 12px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
    flex-wrap: wrap;
  }
  #errorList .senttxt { font-size: 17px; letter-spacing: 1px; }
  #errorList .senterrs { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  #errorList .okmark { color: #16a34a; font-weight: bold; }
  #errorList .skipmark {
    color: #2563eb;
    background: #eff6ff;
    border: 1px solid #93c5fd;
    border-radius: 4px;
    padding: 0 8px;
    font-size: 13px;
  }
  #errorList .picked {
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: 4px; padding: 0 4px;
    text-decoration: line-through;
  }
  #errorList .should {
    color: #16a34a;
    background: #dcfce7;
    border-radius: 4px; padding: 0 4px;
  }
  #fullText .err:hover::after {
    position: absolute;
    top: -30px; left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    z-index: 5;
  }
  .result-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  .result-actions .btn { flex: 1; min-width: 140px; justify-content: center; }

  /* ---------- 移动端适配 ---------- */
  @media (max-width: 600px) {
    body { padding: 14px 10px; }
    h1 { font-size: 19px; }
    .card { padding: 14px 12px; }
    /* 字符框与行间距缩小，一行放更多字 */
    .cbox { width: 30px; height: 36px; font-size: 17px; border-radius: 6px; }
    .row { gap: 4px; }
    #historyWrap { height: 280px; padding: 8px; }
    /* 候选按钮缩小，保证一屏能容纳 10 个 */
    .choice { height: 48px; font-size: 20px; }
    #choices { gap: 8px; }
    /* 按钮加大点击区域，占满整行 */
    .btn { height: 48px; font-size: 15px; }
    .upload-row { flex-direction: column; align-items: stretch; }
    .upload-row .btn { justify-content: center; }
    #fullText { font-size: 17px; line-height: 1.9; }
    #fullText .err:hover::after { font-size: 12px; }
    .topbar { font-size: 12px; }
  }
  /* 小屏手机（≤380px）进一步压缩 */
  @media (max-width: 380px) {
    .cbox { width: 26px; height: 32px; font-size: 15px; }
    .row { gap: 3px; }
    .choice { height: 44px; font-size: 18px; }
  }
</style>
</head>
<body>

<h1>經文、頌文背記</h1>

<!-- 上傳區 -->
<div class="card" id="setup">
  <h2>1. 提供文字</h2>
  <div class="upload-row">
    <button class="btn" id="uploadBtn">選擇文字檔案</button>
    <input type="file" id="fileInput" accept=".txt,.md,.csv,text/*" hidden>
    <span id="fileName"></span>
  </div>
  <p class="or">或使用內建文字：</p>
  <div class="upload-row">
    <button class="btn" id="defaultTextBtn">《唯識三十頌》</button>
    <button class="btn" id="heartSutraBtn">《般若波羅蜜多心經》</button>
    <button class="btn" id="eightVijnanasBtn">《八識規矩頌》</button>
    <button class="btn" id="yogaSilaBtn">《瑜伽菩薩戒略攝頌》</button>
    <button class="btn" id="diamondSutraBtn">《金剛經》</button>
  </div>

  <p class="or">或者直接貼上文字：</p>
  <textarea id="pasteArea" placeholder="在此貼上或輸入文字..."></textarea>
  <div class="setup-actions">
    <button class="btn btn-primary" id="startBtn">開始練習</button>
  </div>
</div>

<!-- 練習區 -->
<div class="card" id="practice">
  <div class="topbar">
    <span id="progressText">0 / 0</span>
    <button class="btn" id="quitBtn" style="height:36px;padding:0 14px;font-size:13px;color:#dc2626;border-color:#fca5a5;">放棄重來</button>
  </div>

  <!-- 歷史框：新框出現後整體向上滾動 -->
  <div id="historyWrap">
    <div id="historyRows"></div>
  </div>

  <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
    <div style="flex:1; min-width:260px;">
      <p class="choices-label" id="choicesLabel">請選出下一個字符：</p>
      <div id="choices"></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; flex-shrink:0;">
      <button class="btn" id="skipBtn" style="color:#2563eb;border-color:#93c5fd;background:#eff6ff;">跳過此句</button>
      <button class="btn" id="finishBtn" style="color:#16a34a;border-color:#86efac;background:#f0fdf4;">全部完成</button>
    </div>
  </div>
</div>

<!-- 完成区 -->
<div class="card" id="result">
  <h2>練習完成</h2>
    <p id="summary"></p>
  <div id="errorList"></div>
  <div class="result-actions">
    <button class="btn btn-primary" id="againBtn">再來一次</button>
    <button class="btn" id="newTextBtn">換一段文字</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- 相似字符表（用于干扰项） ----------
  var SIMILAR = {
    "l": ["I", "1", "|", "j"], "I": ["l", "1", "|"], "1": ["l", "I", "7"],
    "O": ["0", "Q", "o", "D"], "0": ["O", "o", "Q"], "o": ["O", "0", "c"],
    "S": ["5", "s", "8"], "5": ["S", "s", "6"], "B": ["8", "b", "R"],
    "8": ["B", "3", "S"], "Z": ["2", "z"], "2": ["Z", "z"],
    "g": ["9", "q"], "9": ["g", "q", "6"], "q": ["g", "9"],
    "m": ["n"], "n": ["m", "u"], "u": ["v", "n"],
    "c": ["e", "o"], "e": ["c", "a"], "a": ["e", "s"],
    "b": ["d", "p", "6"], "d": ["b", "p"], "p": ["b", "d", "q"],
    "v": ["u", "w"], "w": ["v", "m"], "M": ["W"], "W": ["M"]
  };

  // 練習條目列表：{ t: "word"|"brk", c: 字符(僅 word) }
  var items = [];
  var boxes = [];   // 每個 word 條目對應的 DOM 框
  var picks = [];   // 每個 word 條目用戶選擇的字符
  var idx = 0;      // 當前 word 條目下標
  var total = 0;
  var wrongCount = 0;
  var skippedCount = 0;
  var revealed = []; // 被點擊揭示（未作答）的字符下標
  var skippedIdx = []; // 被跳過的字符下標
  var pendingChoice = null;
  var sentences = []; // 每句：{ start: 該句首個框下標, btn: 句首重新開始按鈕 }

  var DEFAULT_TEXT = "由假說我法　有種種相轉　彼依識所變　此能變唯三\n謂異熟思量　及了別境識\n\n初阿賴耶識　異熟一切種　不可知執受　處了常與觸\n作意受想思　相應唯捨受　是無覆無記　觸等亦如是\n恆轉如瀑流　阿羅漢位捨\n\n次第二能變　是識名末那　依彼轉緣彼　思量為性相\n四煩惱常俱　謂我癡我見　並我慢我愛　及餘觸等俱\n有覆無記攝　隨所生所繫　阿羅漢滅定　出世道無有\n\n次第三能變　差別有六種　了境為性相　善不善俱非\n此心所遍行　別境善煩惱　隨煩惱不定　皆三受相應\n初遍行觸等　次別境謂欲　勝解念定慧　所緣事不同\n善謂信慚愧　無貪等三根　勤安不放逸　行捨及不害\n煩惱謂貪瞋　癡慢疑惡見　隨煩惱謂忿　恨覆惱嫉慳\n誑諂與害憍　無慚及無愧　掉舉與昏沈　不信並懈怠\n放逸及失念　散亂不正知　不定謂悔眠　尋伺二各二\n\n依止根本識　五識隨緣現　或俱或不俱　如波濤依水\n意識常現起　除生無想天　及無心二定　睡眠與悶絕\n\n是諸識轉變　分別所分別　由此彼皆無　故一切唯識\n\n由一切種識　如是如是變　以展轉力故　彼彼分別生\n由諸業習氣　二取習氣俱　前異熟既盡　復生餘異熟\n\n由彼彼遍計　遍計種種物　此遍計所執　自性無所有\n依他起自性　分別緣所生　圓成實於彼　常遠離前性\n故此與依他　非異非不異　如無常等性　非不見此彼\n\n即依此三性　立彼三無性　故佛密意說　一切法無性\n初即相無性　次無自然性　後由遠離前　所執我法性\n此諸法勝義　亦即是真如　常如其性故　即唯識實性\n\n乃至未起識　求住唯識性　於二取隨眠　猶未能伏滅\n現前立少物　謂是唯識性　以有所得故　非實住唯識\n若時於所緣　智都無所得　爾時住唯識　離二取相故\n無得不思議　是出世間智　捨二粗重故　便證得轉依\n\n此即無漏界　不思議善常　安樂解脫身　大牟尼名法";

  var HEART_SUTRA_TEXT = "觀自在菩薩，行深般若波羅蜜多時，照見五蘊皆空度一切苦厄。\n舍利子！色不異空空不異色；色即是空空即是色。受想行識亦復如是。\n舍利子！是諸法空相，不生不滅不垢不淨不增不減。是故空中無色，無受想行識；無眼耳鼻舌身意；無色聲香味觸法；無眼界乃至無意識界；無無明亦無無明盡；乃至無老死亦無老死盡；無苦集滅道；無智亦無得。\n以無所得故，菩提薩埵，依般若波羅蜜多故，心無罣礙；無罣礙故無有恐怖，遠離顛倒夢想究竟涅槃。三世諸佛，依般若波羅蜜多故，得阿耨多羅三藐三菩提。\n故知般若波羅蜜多，是大神咒是大明咒，是無上咒是無等等咒，能除一切苦真實不虛。\n故說般若波羅蜜多咒，即說咒曰：\n揭諦揭諦　\n波羅揭諦　波羅僧揭諦　\n菩提薩婆訶";

  var DIAMOND_SUTRA_TEXT = "如是我聞：\n一時，佛在舍衛國祇樹給孤獨園，與大比丘眾千二百五十人俱。爾時，世尊食時，著衣持鉢，入舍衛大城乞食。於其城中，次第乞已，還至本處。飯食訖，收衣鉢，洗足已，敷座而坐。\n時，長老須菩提在大眾中即從座起，偏袒右肩，右膝著地，合掌恭敬而白佛言：「希有！世尊！如來善護念諸菩薩，善付囑諸菩薩。世尊！善男子、善女人，發阿耨多羅三藐三菩提心，應云何住？云何降伏其心？」\n佛言：「善哉，善哉！須菩提！如汝所說：『如來善護念諸菩薩，善付囑諸菩薩。』汝今諦聽，當為汝說。善男子、善女人，發阿耨多羅三藐三菩提心，應如是住，如是降伏其心。」\n「唯然。世尊！願樂欲聞。」\n佛告須菩提：「諸菩薩摩訶薩應如是降伏其心：『所有一切眾生之類，若卵生、若胎生、若濕生、若化生，若有色、若無色，若有想、若無想、若非有想非無想，我皆令入無餘涅槃而滅度之。』如是滅度無量無數無邊眾生，實無眾生得滅度者。何以故？須菩提！若菩薩有我相、人相、眾生相、壽者相，即非菩薩。\n「復次，須菩提！菩薩於法，應無所住，行於布施，所謂不住色布施，不住聲香味觸法布施。須菩提！菩薩應如是布施，不住於相。何以故？若菩薩不住相布施，其福德不可思量。\n「須菩提！於意云何？東方虛空可思量不？」\n「不也，世尊！」\n「須菩提！南西北方四維上下虛空可思量不？」\n「不也，世尊！」\n「須菩提！菩薩無住相布施，福德亦復如是不可思量。須菩提！菩薩但應如所教住。\n「須菩提！於意云何？可以身相見如來不？」\n「不也，世尊！不可以身相得見如來。何以故？如來所說身相，即非身相。」\n佛告須菩提：「凡所有相，皆是虛妄。若見諸相非相，則見如來。」\n須菩提白佛言：「世尊！頗有眾生，得聞如是言說章句，生實信不？」\n佛告須菩提：「莫作是說。如來滅後，後五百歲，有持戒修福者，於此章句能生信心，以此為實，當知是人不於一佛二佛三四五佛而種善根，已於無量千萬佛所種諸善根，聞是章句，乃至一念生淨信者，須菩提！如來悉知悉見，是諸眾生得如是無量福德。何以故？是諸眾生無復我相、人相、眾生相、壽者相。\n「無法相，亦無非法相。何以故？是諸眾生若心取相，則為著我、人、眾生、壽者。\n「若取法相，即著我、人、眾生、壽者。何以故？若取非法相，即著我、人、眾生、壽者，是故不應取法，不應取非法。以是義故，如來常說：『汝等比丘，知我說法，如筏喻者，法尚應捨，何況非法。』\n「須菩提！於意云何？如來得阿耨多羅三藐三菩提耶？如來有所說法耶？」\n須菩提言：「如我解佛所說義，無有定法名阿耨多羅三藐三菩提，亦無有定法，如來可說。何以故？如來所說法，皆不可取、不可說、非法、非非法。所以者何？一切賢聖，皆以無為法而有差別。」\n「須菩提！於意云何？若人滿三千大千世界七寶以用布施，是人所得福德，寧為多不？」\n須菩提言：「甚多，世尊！何以故？是福德即非福德性，是故如來說福德多。」\n「若復有人，於此經中受持，乃至四句偈等，為他人說，其福勝彼。何以故？須菩提！一切諸佛，及諸佛阿耨多羅三藐三菩提法，皆從此經出。須菩提！所謂佛法者，即非佛法。\n「須菩提！於意云何？須陀洹能作是念：『我得須陀洹果。』不？」\n須菩提言：「不也，世尊！何以故？須陀洹名為入流，而無所入，不入色、聲、香、味、觸、法，是名須陀洹。」\n「須菩提！於意云何？斯陀含能作是念：『我得斯陀含果。』不？」\n須菩提言：「不也，世尊！何以故？斯陀含名一往來，而實無往來，是名斯陀含。」\n「須菩提！於意云何？阿那含能作是念：『我得阿那含果。』不？」\n須菩提言：「不也，世尊！何以故？阿那含名為不來，而實無來，是故名阿那含。」\n「須菩提！於意云何？阿羅漢能作是念：『我得阿羅漢道。』不？」\n須菩提言：「不也，世尊！何以故？實無有法名阿羅漢。世尊！若阿羅漢作是念：『我得阿羅漢道。』即為著我、人、眾生、壽者。世尊！佛說我得無諍三昧，人中最為第一，是第一離欲阿羅漢。我不作是念：『我是離欲阿羅漢。』世尊！我若作是念：『我得阿羅漢道。』世尊則不說須菩提是樂阿蘭那行者。以須菩提實無所行，而名須菩提是樂阿蘭那行。」\n佛告須菩提：「於意云何？如來昔在然燈佛所，於法有所得不？」\n「世尊！如來在然燈佛所，於法實無所得。」\n「須菩提！於意云何？菩薩莊嚴佛土不？」\n「不也，世尊！何以故？莊嚴佛土者，則非莊嚴，是名莊嚴。」\n「是故須菩提，諸菩薩摩訶薩應如是生清淨心，不應住色生心，不應住聲、香、味、觸、法生心，應無所住而生其心。\n「須菩提！譬如有人，身如須彌山王，於意云何？是身為大不？」\n須菩提言：「甚大，世尊！何以故？佛說非身，是名大身。」\n「須菩提！如恒河中所有沙數，如是沙等恒河，於意云何？是諸恒河沙寧為多不？」\n須菩提言：「甚多，世尊！但諸恒河尚多無數，何況其沙。」\n「須菩提！我今實言告汝。若有善男子、善女人，以七寶滿爾所恒河沙數三千大千世界，以用布施，得福多不？」\n須菩提言：「甚多，世尊！」\n佛告須菩提：「若善男子、善女人，於此經中，乃至受持四句偈等，為他人說，而此福德勝前福德。\n「復次，須菩提！隨說是經，乃至四句偈等，當知此處，一切世間天、人、阿修羅，皆應供養，如佛塔廟，何況有人盡能受持讀誦。須菩提！當知是人成就最上第一希有之法，若是經典所在之處，則為有佛，若尊重弟子。」\n爾時，須菩提白佛言：「世尊！當何名此經？我等云何奉持？」\n佛告須菩提：「是經名為“金剛般若波羅蜜”。以是名字，汝當奉持。所以者何？須菩提！佛說般若波羅蜜，則非般若波羅蜜。須菩提！於意云何？如來有所說法不？」\n須菩提白佛言：「世尊！如來無所說。」\n「須菩提！於意云何？三千大千世界所有微塵是為多不？」\n須菩提言：「甚多，世尊！」\n「須菩提！諸微塵，如來說非微塵，是名微塵。如來說世界，非世界，是名世界。\n「須菩提！於意云何？可以三十二相見如來不？」\n「不也，世尊！不可以三十二相得見如來。何以故？如來說三十二相，即是非相，是名三十二相。」\n「須菩提！若有善男子、善女人，以恒河沙等身命布施；若復有人，於此經中，乃至受持四句偈等，為他人說，其福甚多。」\n爾時，須菩提聞說是經，深解義趣，涕淚悲泣，而白佛言：「希有，世尊！佛說如是甚深經典，我從昔來所得慧眼，未曾得聞如是之經。世尊！若復有人得聞是經，信心清淨，則生實相，當知是人，成就第一希有功德。世尊！是實相者，則是非相，是故如來說名實相。世尊！我今得聞如是經典，信解受持不足為難，若當來世，後五百歲，其有眾生，得聞是經，信解受持，是人則為第一希有。何以故？此人無我相、人相、眾生相、壽者相。所以者何？我相即是非相，人相、眾生相、壽者相即是非相。何以故？離一切諸相，則名諸佛。」\n佛告須菩提：「如是，如是！若復有人，得聞是經，不驚、不怖、不畏，當知是人甚為希有。何以故？須菩提！如來說第一波羅蜜，非第一波羅蜜，是名第一波羅蜜。須菩提！忍辱波羅蜜，如來說非忍辱波羅蜜。何以故？須菩提！如我昔為歌利王割截身體，我於爾時，無我相、無人相、無眾生相、無壽者相。何以故？我於往昔節節支解時，若有我相、人相、眾生相、壽者相，應生瞋恨。須菩提！又念過去於五百世作忍辱仙人，於爾所世，無我相、無人相、無眾生相、無壽者相。是故須菩提！菩薩應離一切相，發阿耨多羅三藐三菩提心，不應住色生心，不應住聲香味觸法生心，應生無所住心。若心有住，則為非住。是故佛說：『菩薩心不應住色布施。』\n「須菩提！菩薩為利益一切眾生，應如是布施。如來說：『一切諸相，即是非相。』又說：『一切眾生，則非眾生。』\n「須菩提！如來是真語者、實語者、如語者、不誑語者、不異語者。\n「須菩提！如來所得法，此法無實無虛。須菩提！若菩薩心住於法而行布施，如人入闇，則無所見；若菩薩心不住法而行布施，如人有目，日光明照，見種種色。\n「須菩提！當來之世，若有善男子、善女人，能於此經受持讀誦，則為如來以佛智慧，悉知是人，悉見是人，皆得成就無量無邊功德。\n「須菩提！若有善男子、善女人，初日分以恒河沙等身布施，中日分復以恒河沙等身布施，後日分亦以恒河沙等身布施，如是無量百千萬億劫以身布施；若復有人，聞此經典，信心不逆，其福勝彼，何況書寫、受持、讀誦、為人解說。\n「須菩提！以要言之，是經有不可思議、不可稱量、無邊功德。如來為發大乘者說，為發最上乘者說。若有人能受持讀誦，廣為人說，如來悉知是人，悉見是人，皆得成就不可量、不可稱、無有邊、不可思議功德，如是人等，則為荷擔如來阿耨多羅三藐三菩提。何以故？須菩提！若樂小法者，著我見、人見、眾生見、壽者見，則於此經，不能聽受讀誦、為人解說。\n「須菩提！在在處處，若有此經，一切世間天、人、阿修羅，所應供養；當知此處，則為是塔，皆應恭敬，作禮圍繞，以諸華香而散其處。\n「復次，須菩提！善男子、善女人，受持讀誦此經，若為人輕賤，是人先世罪業，應墮惡道，以今世人輕賤故，先世罪業則為消滅，當得阿耨多羅三藐三菩提。\n「須菩提！我念過去無量阿僧祇劫，於然燈佛前，得值八百四千萬億那由他諸佛，悉皆供養承事，無空過者；若復有人，於後末世，能受持讀誦此經，所得功德，於我所供養諸佛功德，百分不及一，千萬億分、乃至算數譬喻所不能及。\n「須菩提！若善男子、善女人，於後末世，有受持讀誦此經，所得功德，我若具說者，或有人聞，心則狂亂，狐疑不信。須菩提！當知是經義不可思議，果報亦不可思議。」\n爾時，須菩提白佛言：「世尊！善男子、善女人，發阿耨多羅三藐三菩提心，云何應住？云何降伏其心？」\n佛告須菩提：「善男子、善女人，發阿耨多羅三藐三菩提者，當生如是心：『我應滅度一切眾生。滅度一切眾生已，而無有一眾生實滅度者。』何以故？須菩提！若菩薩有我相、人相、眾生相、壽者相，則非菩薩。所以者何？須菩提！實無有法發阿耨多羅三藐三菩提者。\n「須菩提！於意云何？如來於然燈佛所，有法得阿耨多羅三藐三菩提不？」\n「不也，世尊！如我解佛所說義，佛於然燈佛所，無有法得阿耨多羅三藐三菩提。」\n佛言：「如是，如是！須菩提！實無有法如來得阿耨多羅三藐三菩提。須菩提！若有法如來得阿耨多羅三藐三菩提者，然燈佛則不與我受記：『汝於來世，當得作佛，號釋迦牟尼。』以實無有法得阿耨多羅三藐三菩提，是故然燈佛與我受記，作是言：『汝於來世，當得作佛，號釋迦牟尼。』何以故？如來者，即諸法如義。\n「若有人言：『如來得阿耨多羅三藐三菩提。』須菩提！實無有法，佛得阿耨多羅三藐三菩提。須菩提！如來所得阿耨多羅三藐三菩提，於是中無實無虛。是故如來說：『一切法皆是佛法。』須菩提！所言一切法者，即非一切法，是故名一切法。\n「須菩提！譬如人身長大。」\n須菩提言：「世尊！如來說人身長大，則為非大身，是名大身。」\n「須菩提！菩薩亦如是。若作是言：『我當滅度無量眾生。』則不名菩薩。何以故？須菩提！實無有法名為菩薩。是故佛說：『一切法無我、無人、無眾生、無壽者。』須菩提！若菩薩作是言：『我當莊嚴佛土。』是不名菩薩。何以故？如來說莊嚴佛土者，即非莊嚴，是名莊嚴。須菩提！若菩薩通達無我法者，如來說名真是菩薩。\n「須菩提！於意云何？如來有肉眼不？」\n「如是，世尊！如來有肉眼。」\n「須菩提！於意云何？如來有天眼不？」\n「如是，世尊！如來有天眼。」\n「須菩提！於意云何？如來有慧眼不？」\n「如是，世尊！如來有慧眼。」\n「須菩提！於意云何？如來有法眼不？」\n「如是，世尊！如來有法眼。」\n「須菩提！於意云何？如來有佛眼不？」\n「如是，世尊！如來有佛眼。」\n「須菩提！於意云何？恒河中所有沙，佛說是沙不？」\n「如是，世尊！如來說是沙。」\n「須菩提！於意云何？如一恒河中所有沙，有如是等恒河，是諸恒河所有沙數佛世界，如是寧為多不？」\n「甚多，世尊！」\n佛告須菩提：「爾所國土中，所有眾生，若干種心，如來悉知。何以故？如來說諸心，皆為非心，是名為心。所以者何？須菩提！過去心不可得，現在心不可得，未來心不可得。\n「須菩提！於意云何？若有人滿三千大千世界七寶以用布施，是人以是因緣，得福多不？」\n「如是，世尊！此人以是因緣，得福甚多。」\n「須菩提！若福德有實，如來不說得福德多；以福德無故，如來說得福德多。\n「須菩提！於意云何？佛可以具足色身見不？」\n「不也，世尊！如來不應以具足色身見。何以故？如來說具足色身，即非具足色身，是名具足色身。」\n「須菩提！於意云何？如來可以具足諸相見不？」\n「不也，世尊！如來不應以具足諸相見。何以故？如來說諸相具足，即非具足，是名諸相具足。」\n「須菩提！汝勿謂如來作是念：『我當有所說法。』莫作是念，何以故？若人言：『如來有所說法。』即為謗佛，不能解我所說故。須菩提！說法者，無法可說，是名說法。」\n爾時，慧命須菩提白佛言：「世尊！頗有眾生，於未來世，聞說是法，生信心不？」\n佛言：「須菩提！彼非眾生，非不眾生。何以故？須菩提！眾生、眾生者，如來說非眾生，是名眾生。」\n須菩提白佛言：「世尊！佛得阿耨多羅三藐三菩提，為無所得耶？」\n「如是，如是！須菩提！我於阿耨多羅三藐三菩提乃至無有少法可得，是名阿耨多羅三藐三菩提。\n「復次，須菩提！是法平等，無有高下，是名阿耨多羅三藐三菩提；以無我、無人、無眾生、無壽者，修一切善法，則得阿耨多羅三藐三菩提。須菩提！所言善法者，如來說非善法，是名善法。\n「須菩提！若三千大千世界中所有諸須彌山王，如是等七寶聚，有人持用布施；若人以此般若波羅蜜經，乃至四句偈等，受持讀誦、為他人說，於前福德百分不及一，百千萬億分，乃至算數譬喻所不能及。\n「須菩提！於意云何？汝等勿謂如來作是念：『我當度眾生。』須菩提！莫作是念。何以故？實無有眾生如來度者，若有眾生如來度者，如來則有我、人、眾生、壽者。須菩提！如來說：『有我者，則非有我，而凡夫之人以為有我。』須菩提！凡夫者，如來說則非凡夫。\n「須菩提！於意云何？可以三十二相觀如來不？」\n須菩提言：「如是，如是！以三十二相觀如來。」\n佛言：「須菩提！若以三十二相觀如來者，轉輪聖王則是如來。」\n須菩提白佛言：「世尊！如我解佛所說義，不應以三十二相觀如來。」\n爾時，世尊而說偈言：\n「若以色見我，　以音聲求我，　是人行邪道，　不能見如來。\n「須菩提！汝若作是念：『如來不以具足相故，得阿耨多羅三藐三菩提。』須菩提！莫作是念。如來不以具足相故，得阿耨多羅三藐三菩提。\n「須菩提！汝若作是念：『發阿耨多羅三藐三菩提者，說諸法斷滅相。』莫作是念。何以故？發阿耨多羅三藐三菩提心者，於法不說斷滅相。\n「須菩提！若菩薩以滿恒河沙等世界七寶布施；若復有人知一切法無我，得成於忍，此菩薩勝前菩薩所得功德。須菩提！以諸菩薩不受福德故。」\n須菩提白佛言：「世尊！云何菩薩不受福德？」\n「須菩提！菩薩所作福德，不應貪著，是故說不受福德。\n「須菩提！若有人言：『如來若來若去、若坐若臥。』是人不解我所說義。何以故？如來者，無所從來，亦無所去，故名如來。\n「須菩提！若善男子、善女人，以三千大千世界碎為微塵，於意云何？是微塵眾寧為多不？」\n「甚多，世尊！何以故？若是微塵眾實有者，佛則不說是微塵眾。所以者何？佛說微塵眾，則非微塵眾，是名微塵眾。世尊！如來所說三千大千世界，則非世界，是名世界。何以故？若世界實有者，則是一合相。如來說一合相，則非一合相，是名一合相。」\n「須菩提！一合相者，則是不可說，但凡夫之人貪著其事。\n「須菩提！若人言：『佛說我見、人見、眾生見、壽者見。』須菩提！於意云何？是人解我所說義不？」\n「世尊！是人不解如來所說義。何以故？世尊說我見、人見、眾生見、壽者見，即非我見、人見、眾生見、壽者見，是名我見、人見、眾生見、壽者見。」\n「須菩提！發阿耨多羅三藐三菩提心者，於一切法，應如是知，如是見，如是信解，不生法相。須菩提！所言法相者，如來說即非法相，是名法相。\n「須菩提！若有人以滿無量阿僧祇世界七寶持用布施，若有善男子、善女人，發菩薩心者，持於此經，乃至四句偈等，受持讀誦，為人演說，其福勝彼。云何為人演說？不取於相，如如不動。何以故？\n「一切有為法，　如夢、幻、泡、影，　如露亦如電，　應作如是觀。」\n佛說是經已，長老須菩提及諸比丘、比丘尼、優婆塞、優婆夷，一切世間天、人、阿修羅，聞佛所說，皆大歡喜，信受奉行。";

  // ---------- 工具 ----------
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // 是否為漢字（含擴展A區常用範圍）
  function isHan(c) {
    var code = c.charCodeAt(0);
    return (code >= 0x4e00 && code <= 0x9fff) || (code >= 0x3400 && code <= 0x4dbf);
  }

  // 只允許文字字符（字母/數字/漢字），空格、標點、符號都不算
  function isWordChar(c) {
    return /[A-Za-z0-9]/.test(c) || (c.charCodeAt(0) >= 0x4e00 && c.charCodeAt(0) <= 0x9fff);
  }

  // 把原始文字拆成練習條目：文字字符逐一練習；連續的空格/標點等合併為一個換行
  function parseText(text) {
    items = [];
    var inBreak = false;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (isWordChar(c)) {
        items.push({ t: "word", c: c });
        inBreak = false;
      } else if (!inBreak) {
        items.push({ t: "brk" });
        inBreak = true;
      }
    }
    // 去掉開頭和結尾的換行條目
    while (items.length && items[0].t === "brk") items.shift();
    while (items.length && items[items.length - 1].t === "brk") items.pop();
  }

  function wordList() {
    var arr = [];
    for (var i = 0; i < items.length; i++) if (items[i].t === "word") arr.push(items[i].c);
    return arr;
  }

  // 生成 15 個干擾字符：只使用漢字，來自相似表 / 文字中其他漢字 / 漢字兜底字集

      if (revealed.indexOf(i) !== -1) wrongCount++;
      else if (picks[i] === null) skippedCount++;
      else if (picks[i] !== correct) wrongCount++;
    }
  }

  // \u7531\u67D0\u53E5\u91CD\u65B0\u958B\u59CB\uFF1A\u8A72\u53E5\u8D77\u5168\u90E8\u91CD\u7F6E\u70BA\u5F85\u7DF4\u7FD2
  function restartFrom(startBoxIdx) {
    if (pendingChoice) return;
    for (var i = startBoxIdx; i < total; i++) {
      var box = boxes[i];
      box.className = "cbox pending";
      box.innerHTML = "";
      box.textContent = "?";
      picks[i] = null;
    }
    revealed = revealed.filter(function (k) { return k < startBoxIdx; });
    skippedIdx = skippedIdx.filter(function (k) { return k < startBoxIdx; });
    recalcStats(startBoxIdx);
    idx = startBoxIdx;
    pendingChoice = null;
    renderCurrent();
  }

  function renderCurrent() {
    // \u986F\u793A\u7576\u524D\u53E5\u53CA\u4E4B\u524D\u6240\u6709\u53E5\u7684\u91CD\u65B0\u958B\u59CB\u6309\u9215
    sentences.forEach(function (s) {
      if (s.btn) s.btn.classList.toggle("show", s.start <= idx);
    });
    var box = boxes[idx];
    box.className = "cbox current";
    box.innerHTML = "";
    var ph = document.createElement("span");
    ph.className = "ph";
    ph.textContent = "?";
    box.appendChild(ph);
    // 滾動讓當前框可見
    box.scrollIntoView({ block: "center", behavior: "smooth" });
    $("progressText").textContent = idx + " / " + total;
    showChoices();
  }

  // ---------- 候選清單 ----------
  // 固定 16 個按鈕只建立一次，之後僅更新文字，避免畫面閃動
  var fixedChoices = [];
  function initChoices() {
    if (fixedChoices.length) return;
    choicesEl.innerHTML = "";
    for (var i = 0; i < 16; i++) {
      var btn = document.createElement("button");
      btn.className = "choice";
      btn.addEventListener("click", function () {
        if (pendingChoice || idx >= total || !this.dataset.correct) return;
        choose(this, this.textContent, this.dataset.correct);
      });
      choicesEl.appendChild(btn);
      fixedChoices.push(btn);
    }
  }
  function setChoicesEnabled(on) {
    fixedChoices.forEach(function (b) { b.disabled = !on; });
  }
  function showChoices() {
    var correct = items[wordIndexOf(idx)].c;
    var opts = shuffle([correct].concat(distractors(correct)));
    for (var i = 0; i < fixedChoices.length; i++) {
      var b = fixedChoices[i];
      if (i < opts.length) {
        b.style.display = "";
        b.textContent = opts[i];
        b.dataset.correct = correct;
      } else {
        b.style.display = "none";
      }
    }
    setChoicesEnabled(true);
  }

  // 取某框所在句的完整正確文字
  function sentenceOf(boxIdx) {
    var start = boxIdx, end = boxIdx;
    while (start > 0 && items[wordIndexOf(start - 1)] && items[wordIndexOf(start - 1)].t === "word" && !isBreakAfter(start - 1)) start--;
    while (end < total - 1 && !isBreakAfter(end)) end++;
    var t = "";
    for (var i = start; i <= end; i++) t += items[wordIndexOf(i)].c;
    return t;
  }
  function isBreakAfter(boxIdx) {
    var wi = wordIndexOf(boxIdx);
    for (var j = wi + 1; j < items.length; j++) {
      if (items[j].t === "word") return false;
      return true;
    }
    return true;
  }

  // 第 idx 個框對應 items 中的下標（框與 word 條目一一對應，跳過 brk）
  function wordIndexOf(boxIdx) {
    var count = -1;
    for (var i = 0; i < items.length; i++) {
      if (items[i].t === "word") count++;
      if (count === boxIdx) return i;
    }
    return items.length - 1;
  }

  // 點擊當前框：直接以紅色顯示正確字符並進入下一個
  function revealCurrent() {
    if (pendingChoice || idx >= total) return;
    var box = boxes[idx];
    var correct = items[wordIndexOf(idx)].c;
    picks[idx] = null; // 標記為未作答（揭示）
    revealed.push(idx);
    box.className = "cbox current revealed";
    box.innerHTML = "";
    box.textContent = correct;
    wrongCount++;
    pendingChoice = true;
    setChoicesEnabled(false);
    setTimeout(function () {
      box.classList.remove("current");
      pendingChoice = null;
      idx++;
      if (idx < total) {
        renderCurrent();
      } else {
        finish();
      }
    }, 900);
  }

  function choose(btn, picked, correct) {
    if (pendingChoice) return; // 等待確認，防連點
    var box = boxes[idx];
    picks[idx] = picked;
    box.innerHTML = "";
    box.textContent = picked;
    var isWrong = picked !== correct;
    if (isWrong) {
      box.classList.add("wrong");
      wrongCount++;
      var reveal = document.createElement("span");
      reveal.className = "reveal";
      reveal.textContent = correct; // 懸停顯示正確字符
      box.appendChild(reveal);
    } else {
      box.classList.add("correct");
    }
    pendingChoice = true;
    setChoicesEnabled(false);
    setTimeout(function () {
      box.classList.remove("current");
      pendingChoice = null;
      idx++;
      if (idx < total) {
        renderCurrent();
      } else {
        finish();
      }
    }, isWrong ? 900 : 350);
  }

  // ---------- 跳過此句 ----------
  // 將當前句子剩餘字符直接以正確字符填入（藍色顯示），並跳到下一句
  function skipSentence() {
    if (pendingChoice || idx >= total) return;
    var w = wordIndexOf(idx);
    var filled = 0;
    while (w < items.length && items[w].t === "word") {
      var box = boxes[idx + filled];
      var correct = items[w].c;
      picks[idx + filled] = correct;
      box.className = "cbox skipped";
      box.innerHTML = "";
      box.textContent = correct;
      skippedIdx.push(idx + filled);
      filled++;
      w++;
    }
    skippedCount += filled;
    setChoicesEnabled(false);
    idx += filled;
    if (idx < total) {
      renderCurrent();
    } else {
      finish();
    }
  }

  // ---------- 全部完成 ----------
  // 剩餘字符全部以正確字符填入（藍色，計為跳過），直接進入結果頁
  function finishAll() {
    if (pendingChoice) return;
    while (idx < total) {
      var w = wordIndexOf(idx);
      while (w < items.length && items[w].t === "word") {
        var box = boxes[idx];
        var correct = items[w].c;
        picks[idx] = correct;
        box.className = "cbox skipped";
        box.innerHTML = "";
        box.textContent = correct;
        skippedIdx.push(idx);
        skippedCount++;
        idx++;
        w++;
      }
      // brk 不佔框，idx 只對應 word 框，無需額外跳過
    }
    setChoicesEnabled(false);
    finish();
  }

  // ---------- 完成 ----------
  function finish() {
    practiceEl.style.display = "none";
    resultEl.style.display = "block";
    var answered = total - skippedCount;
    var pct = answered ? Math.round((answered - wrongCount) * 100 / answered) : 100;
    $("summary").textContent = "共 " + total + " 個字符，練習 " + answered + " 個（跳過 " + skippedCount + " 個），答錯 " + wrongCount + " 個，正確率 " + pct + "%。紅色為答錯的字，懸停可查看正確字符；藍色為跳過的句子。空格與標點已跳過並以換行顯示。";
    // 逐句檢查：每句正確文字在左，該句錯誤在右
    var el = $("errorList");
    el.innerHTML = "";
    var sentRows = [];
    var curText = "", curErrs = [];
    var curN = 0, curSk = 0;
    for (var i = 0; i < total; i++) {
      var c = items[wordIndexOf(i)].c;
      curText += c;
      curN++;
      if (skippedIdx.indexOf(i) !== -1) curSk++;
      if (revealed.indexOf(i) !== -1) curErrs.push({ picked: null, correct: c });
      else if (picks[i] !== null && picks[i] !== c) curErrs.push({ picked: picks[i], correct: c });
      if (isBreakAfter(i)) {
        sentRows.push({ text: curText, errs: curErrs, allSkipped: curN > 0 && curSk === curN });
        curText = ""; curErrs = []; curN = 0; curSk = 0;
      }
    }
    if (curText) sentRows.push({ text: curText, errs: curErrs, allSkipped: curN > 0 && curSk === curN });
    var bad = sentRows;
    if (!bad.length) {
      var ok = document.createElement("div");
      ok.className = "none";
      ok.textContent = "全部正確，沒有錯誤！";
      el.appendChild(ok);
    } else {
      bad.forEach(function (r) {
        var d = document.createElement("div");
        d.className = "sentrow";
        var t = document.createElement("span");
        t.className = "senttxt";
        t.textContent = r.text;
        var er = document.createElement("span");
        er.className = "senterrs";
        r.errs.forEach(function (e) {
          var a = document.createElement("span");
          a.className = "picked";
          a.textContent = (e.picked === null ? "未作答" : e.picked);
          var b = document.createElement("span");
          b.className = "should";
          b.textContent = e.correct;
          er.appendChild(a);
          er.appendChild(b);
        });
        if (r.allSkipped) {
          var skm = document.createElement("span");
          skm.className = "skipmark";
          skm.textContent = "跳過";
          er.appendChild(skm);
        } else if (!r.errs.length) {
          var okm = document.createElement("span");
          okm.className = "okmark";
          okm.textContent = "\u2713";
          er.appendChild(okm);
        }
        d.appendChild(t);
        d.appendChild(er);
        el.appendChild(d);
      });
    }
  }

  // ---------- 開始 / 重來 ----------
  function startPractice(t) {
    text = t.replace(/\r\n/g, "\n").trim();
    if (!text) { alert("請先提供文字內容"); return; }
    parseText(text);
    if (!wordList().length) { alert("文字中沒有可練習的文字字符"); return; }
    setupEl.style.display = "none";
    resultEl.style.display = "none";
    practiceEl.style.display = "flex";
    buildBoard();
  }

  var text = "";

  // ---------- 事件綁定 ----------
  $("uploadBtn").addEventListener("click", function () { $("fileInput").click(); });
  $("fileInput").addEventListener("change", function () {
    var f = this.files[0];
    if (!f) return;
    $("fileName").textContent = f.name;
    var reader = new FileReader();
    reader.onload = function () { $("pasteArea").value = reader.result; };
    reader.readAsText(f);
  });
  $("defaultTextBtn").addEventListener("click", function () {
    $("pasteArea").value = DEFAULT_TEXT;
    $("fileName").textContent = "內建文字《唯識三十頌》";
  });
  $("heartSutraBtn").addEventListener("click", function () {
    $("pasteArea").value = HEART_SUTRA_TEXT;
    $("fileName").textContent = "內建文字《般若波羅蜜多心經》";
  });
  $("eightVijnanasBtn").addEventListener("click", function () {
    $("pasteArea").value = EIGHT_VIJNANAS_TEXT;
    $("fileName").textContent = "內建文字《八識規矩頌》";
  });
  $("yogaSilaBtn").addEventListener("click", function () {
    $("pasteArea").value = YOGA_SILA_TEXT;
    $("fileName").textContent = "內建文字《瑜伽菩薩戒略攝頌》";
  });
  $("diamondSutraBtn").addEventListener("click", function () {
    $("pasteArea").value = DIAMOND_SUTRA_TEXT;
    $("fileName").textContent = "內建文字《金剛經》";
  });
  $("skipBtn").addEventListener("click", skipSentence);
  $("finishBtn").addEventListener("click", finishAll);
  historyRows.addEventListener("click", function (e) {
    var rbtn = e.target.closest(".reloadBtn");
    if (rbtn) {
      for (var i = 0; i < sentences.length; i++) {
        if (sentences[i].btn === rbtn) {
          restartFrom(sentences[i].start);
          return;
        }
      }
      return;
    }
    if (pendingChoice || idx >= total) return;
    if (boxes[idx] && boxes[idx].contains(e.target)) revealCurrent();
  });
  $("startBtn").addEventListener("click", function () { startPractice($("pasteArea").value); });
  $("quitBtn").addEventListener("click", function () {
    setupEl.style.display = "block";
    practiceEl.style.display = "none";
    resultEl.style.display = "none";
  });
  $("againBtn").addEventListener("click", function () { startPractice(text); });
  $("newTextBtn").addEventListener("click", function () {
    resultEl.style.display = "none";
    setupEl.style.display = "block";
    $("pasteArea").value = "";
    $("fileName").textContent = "";
  });
})();
</script>
</body>
</html>
