<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經文、頌文背記</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --border: #e5e7eb;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #dceafc 0%, #eef0fb 45%, #ddf2ec 100%) fixed;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    width: 100%;
    max-width: 720px;
    box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }

  /* ---------- 上傳區 ---------- */
  #setup h2 { font-size: 16px; margin-bottom: 12px; }
  .upload-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 44px;
    padding: 0 20px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  #fileName { color: var(--muted); font-size: 13px; }
  .or { color: var(--muted); font-size: 13px; margin: 14px 0 8px; }
  textarea {
    width: 100%; min-height: 90px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .setup-actions { margin-top: 14px; text-align: right; }

  /* ---------- 練習區 ---------- */
  #practice { display: none; flex-direction: column; gap: 16px; }
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); }

  /* 歷史框區域：隨進度向上滾動 */
  #historyWrap {
    height: 360px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fafbfc;
    padding: 10px;
  }
  #historyRows { display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; min-height: 100%; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .cbox {
    width: 42px; height: 48px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
    position: relative;
  }
  .cbox.correct { color: #16a34a; border-color: #86efac; }
  .cbox.wrong {
    color: var(--danger);
    border-color: #fca5a5;
    background: var(--danger-soft);
    cursor: help;
  }
  /* 懸停錯誤框顯示正確字符 */
  .cbox.wrong .reveal { display: none; }
  .cbox.wrong:hover .reveal {
    display: flex;
    position: absolute;
    inset: 0;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 7px;
    z-index: 2;
  }
  .cbox.current {
    border: 2px dashed var(--accent);
    background: #fff;
  }
  .cbox.current { cursor: pointer; }
  .cbox.current .ph { color: #cbd5e1; font-size: 14px; }
  .cbox.revealed {
    color: #dc2626;
    border-color: #fca5a5;
    background: #fff5f5;
  }
  .cbox.pending { color: #d1d5db; }
  /* 句首重新開始按鈕 */
  .reloadBtn {
    order: 1;
    width: 42px; height: 48px;
    border: 1px solid #93c5fd;
    border-radius: 8px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 22px;
    cursor: pointer;
    flex-shrink: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .reloadBtn.show { display: inline-flex; }
  .reloadBtn:hover { background: #fef3c7; }
  @media (max-width: 600px) {
    .reloadBtn { width: 32px; height: 38px; font-size: 17px; border-radius: 6px; }
  }
  .cbox.skipped {
    color: #2563eb;
    border-color: #93c5fd;
    background: #eff6ff;
    font-style: normal;
  }
  #fullText .skipgreen { color: #2563eb; }

  /* 候選清單 */
  .choices-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; text-align: center; }
  /* 候選區：每行固定 7 個 */
  #choices {
    display: grid;
    grid-template-columns: repeat(4, 56px);
    gap: 10px;
    justify-content: center;
    background: #eef4fb;
    border: 1px solid #d6e4f7;
    border-radius: 12px;
    padding: 12px;
  }
  .choice:disabled { opacity: .45; cursor: default; transform: none; }
  .choice {
    min-width: 0; width: 100%; height: 56px;
    padding: 0 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-size: 26px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .1s, border-color .15s, background .15s;
  }
  .choice:hover { transform: translateY(-2px); border-color: var(--accent); background: var(--accent-soft); }
  .choice:active { transform: translateY(0); }

  /* ---------- 完成區 ---------- */
  #result { display: none; }
  #result h2 { font-size: 16px; margin-bottom: 4px; }
  #summary { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  #fullText {
    font-size: 20px;
    line-height: 2;
    word-break: break-all;
  }
  #fullText .err {
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: 4px;
    padding: 0 2px;
    cursor: help;
    position: relative;
  }
  #errorList { margin-bottom: 16px; }
  #errorList h3 { font-size: 14px; margin-bottom: 8px; color: var(--danger); }
  #errorList .none { color: #16a34a; font-size: 14px; }
  #errorList .sentrow {
    display: flex; align-items: baseline; gap: 12px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--border);
    flex-wrap: wrap;
  }
  #errorList .senttxt { font-size: 17px; letter-spacing: 1px; }
  #errorList .senterrs { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  #errorList .okmark { color: #16a34a; font-weight: bold; }
  #errorList .picked {
    color: var(--danger);
    background: var(--danger-soft);
    border-radius: 4px; padding: 0 4px;
    text-decoration: line-through;
  }
  #errorList .should {
    color: #16a34a;
    background: #dcfce7;
    border-radius: 4px; padding: 0 4px;
  }
  #fullText .err:hover::after {
    position: absolute;
    top: -30px; left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
    z-index: 5;
  }
  .result-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  .result-actions .btn { flex: 1; min-width: 140px; justify-content: center; }

  /* ---------- 移动端适配 ---------- */
  @media (max-width: 600px) {
    body { padding: 14px 10px; }
    h1 { font-size: 19px; }
    .card { padding: 14px 12px; }
    /* 字符框与行间距缩小，一行放更多字 */
    .cbox { width: 30px; height: 36px; font-size: 17px; border-radius: 6px; }
    .row { gap: 4px; }
    #historyWrap { height: 280px; padding: 8px; }
    /* 候选按钮缩小，保证一屏能容纳 10 个 */
    .choice { height: 48px; font-size: 20px; }
    #choices { gap: 8px; }
    /* 按钮加大点击区域，占满整行 */
    .btn { height: 48px; font-size: 15px; }
    .upload-row { flex-direction: column; align-items: stretch; }
    .upload-row .btn { justify-content: center; }
    #fullText { font-size: 17px; line-height: 1.9; }
    #fullText .err:hover::after { font-size: 12px; }
    .topbar { font-size: 12px; }
  }
  /* 小屏手机（≤380px）进一步压缩 */
  @media (max-width: 380px) {
    .cbox { width: 26px; height: 32px; font-size: 15px; }
    .row { gap: 3px; }
    .choice { height: 44px; font-size: 18px; }
  }
</style>
</head>
<body>

<h1>經文、頌文背記</h1>

<!-- 上傳區 -->
<div class="card" id="setup">
  <h2>1. 提供文字</h2>
  <div class="upload-row">
    <button class="btn" id="uploadBtn">選擇文字檔案</button>
    <input type="file" id="fileInput" accept=".txt,.md,.csv,text/*" hidden>
    <span id="fileName"></span>
  </div>
  <p class="or">或使用內建文字：</p>
  <div class="upload-row">
    <button class="btn" id="defaultTextBtn">《唯識三十頌》（玄奘譯）</button>
    <button class="btn" id="heartSutraBtn">《般若波羅蜜多心經》（玄奘譯）</button>
    <button class="btn" id="eightVijnanasBtn">《八識規矩頌》（玄奘作）</button>
    <button class="btn" id="yogaSilaBtn">《瑜伽菩薩戒略攝頌》</button>
  </div>

  <p class="or">或者直接貼上文字：</p>
  <textarea id="pasteArea" placeholder="在此貼上或輸入文字..."></textarea>
  <div class="setup-actions">
    <button class="btn btn-primary" id="startBtn">開始練習</button>
  </div>
</div>

<!-- 練習區 -->
<div class="card" id="practice">
  <div class="topbar">
    <span id="progressText">0 / 0</span>
    <button class="btn" id="quitBtn" style="height:36px;padding:0 14px;font-size:13px;color:#dc2626;border-color:#fca5a5;">放棄重來</button>
  </div>

  <!-- 歷史框：新框出現後整體向上滾動 -->
  <div id="historyWrap">
    <div id="historyRows"></div>
  </div>

  <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
    <div style="flex:1; min-width:260px;">
      <p class="choices-label" id="choicesLabel">請選出下一個字符：</p>
      <div id="choices"></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; flex-shrink:0;">
      <button class="btn" id="skipBtn" style="color:#2563eb;border-color:#93c5fd;background:#eff6ff;">跳過此句</button>
      <button class="btn" id="finishBtn" style="color:#16a34a;border-color:#86efac;background:#f0fdf4;">全部完成</button>
    </div>
  </div>
</div>

<!-- 完成区 -->
<div class="card" id="result">
  <h2>練習完成</h2>
    <p id="summary"></p>
  <div id="errorList"></div>
  <div class="result-actions">
    <button class="btn btn-primary" id="againBtn">再來一次</button>
    <button class="btn" id="newTextBtn">換一段文字</button>
  </div>
</div>

  var $ = function (id) { return document.getElementById(id); };
  var setupEl = $("setup"), practiceEl = $("practice"), resultEl = $("result");

  // ---------- 工具 ----------
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // 是否為漢字（含擴展A區常用範圍）
  function isHan(c) {
    var code = c.charCodeAt(0);
    return (code >= 0x4e00 && code <= 0x9fff) || (code >= 0x3400 && code <= 0x4dbf);
  }

  // 只允許文字字符（字母/數字/漢字），空格、標點、符號都不算
  function isWordChar(c) {
    return /[A-Za-z0-9]/.test(c) || (c.charCodeAt(0) >= 0x4e00 && c.charCodeAt(0) <= 0x9fff);
  }

  // 把原始文字拆成練習條目：文字字符逐一練習；連續的空格/標點等合併為一個換行
  function parseText(text) {
    items = [];
    var inBreak = false;
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (isWordChar(c)) {
        items.push({ t: "word", c: c });
        inBreak = false;
      } else if (!inBreak) {
        items.push({ t: "brk" });
        inBreak = true;
      }
    }
    // 去掉開頭和結尾的換行條目
    while (items.length && items[0].t === "brk") items.shift();
    while (items.length && items[items.length - 1].t === "brk") items.pop();
  }

  function wordList() {
    var arr = [];
    for (var i = 0; i < items.length; i++) if (items[i].t === "word") arr.push(items[i].c);
    return arr;
  }

  // 生成 15 個干擾字符：只使用漢字，來自相似表 / 文字中其他漢字 / 漢字兜底字集
  function distractors(correct) {
    var pool = [];
    var sim = (SIMILAR[correct] || []).filter(isHan);
    pool = pool.concat(sim);
    var hanFromText = wordList().filter(function (c) { return isHan(c) && c !== correct; });
    for (var i = 0; i < 8 && hanFromText.length; i++) pool.push(pick(hanFromText));
    var fallback = "的一是了我不人在他有這上們來到時大地為子中你說生國年著就那和要她出也得裡後自以會家可下而過天去能對小多然於心學麼之都好看起發當沒成只如事把還用第樣道想作種開美總從無情己面最女但現前些所同日手又行意動方期它頭經長兒回位分愛老因很給名法間斯知世什兩次使身者被高已親其進此話常與活正感識性相變所說空法故無自體義門行位深度海藏塵想觀照真如淨染熏習種子現量分別執持含藏異熟末那賴耶遍計依他圓成實苦集滅道菩提涅槃觸作意受捨貪瞋癡慢疑慚愧不放逸掉舉惛沈懈怠失念散亂不正知尋伺悔眠惡見憍慳誑諂忿恨覆惱嫉害";

    while (pool.length < 40) pool.push(pick(fallback));
    pool = pool.filter(isHan);
    var uniq = pool.filter(function (c, k) { return c !== correct && pool.indexOf(c) === k; });
    return shuffle(uniq).slice(0, 15);
  }

  // ---------- 构建历史区 ----------
  // 所有 word 條目各佔一個框；換行條目不佔框，只強制新起一行
  function buildBoard() {
    historyRows.innerHTML = "";
    boxes = [];
    picks = [];
    skippedIdx = [];
    var row = null, col = 0;
    sentences = [];
    function newRow() {
      row = document.createElement("div");
      row.className = "row";
      var rbtn = document.createElement("button");
      rbtn.className = "reloadBtn";
      rbtn.textContent = "\u27F3";
      rbtn.title = "\u7531\u6B64\u53E5\u91CD\u65B0\u958B\u59CB";
      row.appendChild(rbtn);
      sentences.push({ start: boxes.length, btn: rbtn });
      historyRows.appendChild(row);
      col = 0;
    }
    newRow();
    for (var i = 0; i < items.length; i++) {
      if (items[i].t === "brk") {
        newRow();
        continue;
      }
      var box = document.createElement("div");
      box.className = "cbox pending";
      box.textContent = "?";
      row.appendChild(box);
      boxes.push(box);
      picks.push(null);
      col++;
    }
    total = boxes.length;
    idx = 0;
    wrongCount = 0;
    skippedCount = 0;
    revealed = [];
    pendingChoice = null;
    initChoices();
    setChoicesEnabled(false);
    if (total) renderCurrent();
  }

  // \u91CD\u65B0\u7D71\u8A08\u5DF2\u4FDD\u7559\u90E8\u5206\u7684\u7B54\u932F\u8207\u8DF3\u904E\u6578
  function recalcStats(upto) {
    wrongCount = 0;
    skippedCount = 0;
    for (var i = 0; i < upto; i++) {
      var correct = items[wordIndexOf(i)].c;
      if (revealed.indexOf(i) !== -1) wrongCount++;
      else if (picks[i] === null) skippedCount++;
      else if (picks[i] !== correct) wrongCount++;
    }
  }

  // \u7531\u67D0\u53E5\u91CD\u65B0\u958B\u59CB\uFF1A\u8A72\u53E5\u8D77\u5168\u90E8\u91CD\u7F6E\u70BA\u5F85\u7DF4\u7FD2
  function restartFrom(startBoxIdx) {
    if (pendingChoice) return;
    for (var i = startBoxIdx; i < total; i++) {
      var box = boxes[i];
      box.className = "cbox pending";
      box.innerHTML = "";
      box.textContent = "?";
      picks[i] = null;
    }
    revealed = revealed.filter(function (k) { return k < startBoxIdx; });
    skippedIdx = skippedIdx.filter(function (k) { return k < startBoxIdx; });
    recalcStats(startBoxIdx);
    idx = startBoxIdx;
    pendingChoice = null;
    renderCurrent();
  }

  function renderCurrent() {
    // \u986F\u793A\u7576\u524D\u53E5\u53CA\u4E4B\u524D\u6240\u6709\u53E5\u7684\u91CD\u65B0\u958B\u59CB\u6309\u9215
    sentences.forEach(function (s) {
      if (s.btn) s.btn.classList.toggle("show", s.start <= idx);
    });
    var box = boxes[idx];
    box.className = "cbox current";
    box.innerHTML = "";
    var ph = document.createElement("span");
    ph.className = "ph";
    ph.textContent = "?";
    box.appendChild(ph);
    // 滾動讓當前框可見
    box.scrollIntoView({ block: "center", behavior: "smooth" });
    $("progressText").textContent = idx + " / " + total;
    showChoices();
  }

  // ---------- 候選清單 ----------
  // 固定 16 個按鈕只建立一次，之後僅更新文字，避免畫面閃動
  var fixedChoices = [];
  function initChoices() {
    if (fixedChoices.length) return;
    choicesEl.innerHTML = "";
    for (var i = 0; i < 16; i++) {
      var btn = document.createElement("button");
      btn.className = "choice";
      btn.addEventListener("click", function () {
        if (pendingChoice || idx >= total || !this.dataset.correct) return;
        choose(this, this.textContent, this.dataset.correct);
      });
      choicesEl.appendChild(btn);
      fixedChoices.push(btn);
    }
  }
  function setChoicesEnabled(on) {
    fixedChoices.forEach(function (b) { b.disabled = !on; });
  }
  function showChoices() {
    var correct = items[wordIndexOf(idx)].c;
    var opts = shuffle([correct].concat(distractors(correct)));
    for (var i = 0; i < fixedChoices.length; i++) {
      var b = fixedChoices[i];
      if (i < opts.length) {
        b.style.display = "";
        b.textContent = opts[i];
        b.dataset.correct = correct;
      } else {
        b.style.display = "none";
      }
    }
    setChoicesEnabled(true);
  }

  // 取某框所在句的完整正確文字
  function sentenceOf(boxIdx) {
    var start = boxIdx, end = boxIdx;
    while (start > 0 && items[wordIndexOf(start - 1)] && items[wordIndexOf(start - 1)].t === "word" && !isBreakAfter(start - 1)) start--;
    while (end < total - 1 && !isBreakAfter(end)) end++;
    var t = "";
    for (var i = start; i <= end; i++) t += items[wordIndexOf(i)].c;
    return t;
  }
  function isBreakAfter(boxIdx) {
    var wi = wordIndexOf(boxIdx);
    for (var j = wi + 1; j < items.length; j++) {
      if (items[j].t === "word") return false;
      return true;
    }
    return true;
  }

  // 第 idx 個框對應 items 中的下標（框與 word 條目一一對應，跳過 brk）
  function wordIndexOf(boxIdx) {
    var count = -1;
    for (var i = 0; i < items.length; i++) {
      if (items[i].t === "word") count++;
      if (count === boxIdx) return i;
    }
    return items.length - 1;
  }

  // 點擊當前框：直接以紅色顯示正確字符並進入下一個
  function revealCurrent() {
    if (pendingChoice || idx >= total) return;
    var box = boxes[idx];
    var correct = items[wordIndexOf(idx)].c;
    picks[idx] = null; // 標記為未作答（揭示）
    revealed.push(idx);
    box.className = "cbox current revealed";
    box.innerHTML = "";
    box.textContent = correct;
    wrongCount++;
    pendingChoice = true;
    setChoicesEnabled(false);
    setTimeout(function () {
      box.classList.remove("current");
      pendingChoice = null;
      idx++;
      if (idx < total) {
        renderCurrent();
      } else {
        finish();
      }
    }, 900);
  }

  function choose(btn, picked, correct) {
    if (pendingChoice) return; // 等待確認，防連點
    var box = boxes[idx];
    picks[idx] = picked;
    box.innerHTML = "";
    box.textContent = picked;
    var isWrong = picked !== correct;
    if (isWrong) {
      box.classList.add("wrong");
      wrongCount++;
      var reveal = document.createElement("span");
      reveal.className = "reveal";
      reveal.textContent = correct; // 懸停顯示正確字符
      box.appendChild(reveal);
    } else {
      box.classList.add("correct");
    }
    pendingChoice = true;
    setChoicesEnabled(false);
    setTimeout(function () {
      box.classList.remove("current");
      pendingChoice = null;
      idx++;
      if (idx < total) {
        renderCurrent();
      } else {
        finish();
      }
    }, isWrong ? 900 : 350);
  }

  // ---------- 跳過此句 ----------
  // 將當前句子剩餘字符直接以正確字符填入（藍色顯示），並跳到下一句
  function skipSentence() {
    if (pendingChoice || idx >= total) return;
    var w = wordIndexOf(idx);
    var filled = 0;
    while (w < items.length && items[w].t === "word") {
      var box = boxes[idx + filled];
      var correct = items[w].c;
      picks[idx + filled] = correct;
      box.className = "cbox skipped";
      box.innerHTML = "";
      box.textContent = correct;
      skippedIdx.push(idx + filled);
      filled++;
      w++;
    }
    skippedCount += filled;
    setChoicesEnabled(false);
    idx += filled;
    if (idx < total) {
      renderCurrent();
    } else {
      finish();
    }
  }

  // ---------- 全部完成 ----------
  // 剩餘字符全部以正確字符填入（藍色，計為跳過），直接進入結果頁
  function finishAll() {
    if (pendingChoice) return;
    while (idx < total) {
      var w = wordIndexOf(idx);
      while (w < items.length && items[w].t === "word") {
        var box = boxes[idx];
        var correct = items[w].c;
        picks[idx] = correct;
        box.className = "cbox skipped";
        box.innerHTML = "";
        box.textContent = correct;
        skippedIdx.push(idx);
        skippedCount++;
        idx++;
        w++;
      }
      idx++; // 跳過 brk
    }
    setChoicesEnabled(false);
    finish();
  }

  // ---------- 完成 ----------
  function finish() {
    practiceEl.style.display = "none";
    resultEl.style.display = "block";
    var answered = total - skippedCount;
    var pct = answered ? Math.round((answered - wrongCount) * 100 / answered) : 100;
    $("summary").textContent = "共 " + total + " 個字符，練習 " + answered + " 個（跳過 " + skippedCount + " 個），答錯 " + wrongCount + " 個，正確率 " + pct + "%。紅色為答錯的字，懸停可查看正確字符；藍色為跳過的句子。空格與標點已跳過並以換行顯示。";
    // 逐句檢查：每句正確文字在左，該句錯誤在右
    var el = $("errorList");
    el.innerHTML = "";
    var sentRows = [];
    var curText = "", curErrs = [];
    for (var i = 0; i < total; i++) {
      var c = items[wordIndexOf(i)].c;
      curText += c;
      if (revealed.indexOf(i) !== -1) curErrs.push({ picked: null, correct: c });
      else if (picks[i] !== null && picks[i] !== c) curErrs.push({ picked: picks[i], correct: c });
      if (isBreakAfter(i)) {
        sentRows.push({ text: curText, errs: curErrs });
        curText = ""; curErrs = [];
      }
    }
    if (curText) sentRows.push({ text: curText, errs: curErrs });
    var bad = sentRows;
    if (!bad.length) {
      var ok = document.createElement("div");
      ok.className = "none";
      ok.textContent = "全部正確，沒有錯誤！";
      el.appendChild(ok);
    } else {
      bad.forEach(function (r) {
        var d = document.createElement("div");
        d.className = "sentrow";
        var t = document.createElement("span");
        t.className = "senttxt";
        t.textContent = r.text;
        var er = document.createElement("span");
        er.className = "senterrs";
        r.errs.forEach(function (e) {
          var a = document.createElement("span");
          a.className = "picked";
          a.textContent = (e.picked === null ? "未作答" : e.picked);
          var b = document.createElement("span");
          b.className = "should";
          b.textContent = e.correct;
          er.appendChild(a);
          er.appendChild(b);
        });
        if (!r.errs.length) {
          var okm = document.createElement("span");
          okm.className = "okmark";
          okm.textContent = "\u2713";
          er.appendChild(okm);
        }
        d.appendChild(t);
        d.appendChild(er);
        el.appendChild(d);
      });
    }
  }

  // ---------- 開始 / 重來 ----------
  function startPractice(t) {
    text = t.replace(/\r\n/g, "\n").trim();
    if (!text) { alert("請先提供文字內容"); return; }
    parseText(text);
    if (!wordList().length) { alert("文字中沒有可練習的文字字符"); return; }
    setupEl.style.display = "none";
    resultEl.style.display = "none";
    practiceEl.style.display = "flex";
    buildBoard();
  }

  var text = "";

  // ---------- 事件綁定 ----------
  $("uploadBtn").addEventListener("click", function () { $("fileInput").click(); });
  $("fileInput").addEventListener("change", function () {
    var f = this.files[0];
    if (!f) return;
    $("fileName").textContent = f.name;
    var reader = new FileReader();
    reader.onload = function () { $("pasteArea").value = reader.result; };
    reader.readAsText(f);
  });
  $("defaultTextBtn").addEventListener("click", function () {
    $("pasteArea").value = DEFAULT_TEXT;
    $("fileName").textContent = "內建文字《唯識三十頌》";
  });
  $("heartSutraBtn").addEventListener("click", function () {
    $("pasteArea").value = HEART_SUTRA_TEXT;
    $("fileName").textContent = "內建文字《般若波羅蜜多心經》";
  });
  $("eightVijnanasBtn").addEventListener("click", function () {
    $("pasteArea").value = EIGHT_VIJNANAS_TEXT;
    $("fileName").textContent = "內建文字《八識規矩頌》";
  });
  $("yogaSilaBtn").addEventListener("click", function () {
    $("pasteArea").value = YOGA_SILA_TEXT;
    $("fileName").textContent = "內建文字《瑜伽菩薩戒略攝頌》";
  });
  $("skipBtn").addEventListener("click", skipSentence);
  $("finishBtn").addEventListener("click", finishAll);
  historyRows.addEventListener("click", function (e) {
    var rbtn = e.target.closest(".reloadBtn");
    if (rbtn) {
      for (var i = 0; i < sentences.length; i++) {
        if (sentences[i].btn === rbtn) {
          restartFrom(sentences[i].start);
          return;
        }
      }
      return;
    }
    if (pendingChoice || idx >= total) return;
    if (boxes[idx] && boxes[idx].contains(e.target)) revealCurrent();
  });
  $("startBtn").addEventListener("click", function () { startPractice($("pasteArea").value); });
  $("quitBtn").addEventListener("click", function () {
    setupEl.style.display = "block";
    practiceEl.style.display = "none";
    resultEl.style.display = "none";
  });
  $("againBtn").addEventListener("click", function () { startPractice(text); });
  $("newTextBtn").addEventListener("click", function () {
    resultEl.style.display = "none";
    setupEl.style.display = "block";
    $("pasteArea").value = "";
    $("fileName").textContent = "";
  });
})();
</script>
</body>
</html>
